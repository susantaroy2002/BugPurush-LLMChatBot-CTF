<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE DASHBOARD // BUG PURSH CTF</title>
<style>
  :root{
    --bg:#0a0e0d;--panel:#0f1513;--panel-2:#121a17;--line:#1d2a25;
    --amber:#ffb347;--acid:#39ff8b;--acid-dim:#1f7a48;--red:#ff4d5e;
    --txt:#c9d6cf;--txt-dim:#6b7f76;--user:#5fd0ff;
    --mono:'SF Mono',ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--mono);min-height:100vh;
    background-image:
      radial-gradient(circle at 20% 0%,rgba(57,255,139,.04),transparent 40%),
      repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(57,255,139,.012) 3px,rgba(57,255,139,.012) 4px);}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:24px;letter-spacing:1px;color:var(--acid);text-shadow:0 0 14px rgba(57,255,139,.35)}
  h1 .slash{color:var(--amber)}
  .tag{color:var(--txt-dim);font-size:12px;letter-spacing:1px}
  .live{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--txt-dim)}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--acid);
    box-shadow:0 0 8px var(--acid);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .stat{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:12px 18px;min-width:130px}
  .stat .k{font-size:11px;color:var(--txt-dim);letter-spacing:1px}
  .stat .v{font-size:26px;color:var(--acid);margin-top:3px;text-shadow:0 0 10px rgba(57,255,139,.3)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;color:var(--amber);font-size:11px;letter-spacing:1px;font-weight:400;
    padding:8px 12px;border-bottom:1px solid var(--line)}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line)}
  tbody tr{transition:background .3s}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr.flash{animation:rowflash 1.1s}
  @keyframes rowflash{0%{background:rgba(57,255,139,.18)}100%{background:transparent}}
  .rank{color:var(--txt-dim);width:44px}
  .rank.gold{color:#ffd451;font-weight:700}
  .rank.silver{color:#cfd8dc;font-weight:700}
  .rank.bronze{color:#d99a5b;font-weight:700}
  .pname{color:var(--acid);font-weight:700}
  .ptitle{color:var(--amber);font-style:italic;font-size:12px;display:block;margin-top:2px}
  .prog{display:flex;gap:4px}
  .cell{width:26px;height:14px;border:1px solid var(--line);border-radius:2px;display:inline-block}
  .cell.done{background:var(--acid);border-color:var(--acid);box-shadow:0 0 6px rgba(57,255,139,.4)}
  .cell.cur{border-color:var(--amber);box-shadow:0 0 6px rgba(255,179,71,.4)}
  .score{color:var(--acid);font-weight:700;font-size:16px}
  .hints{color:var(--txt-dim);font-size:12px}
  .ago{color:var(--txt-dim);font-size:11px}
  .empty{padding:50px;text-align:center;color:var(--txt-dim);letter-spacing:1px;border:1px dashed var(--line);border-radius:2px}
  .footer{margin-top:22px;text-align:center;color:var(--txt-dim);font-size:11px;letter-spacing:1px}
  a.back{color:var(--acid-dim);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LIVE DASHBOARD <span class="slash">//</span> BUG PURSH CTF</h1>
    <span class="tag">// real-time participant leaderboard</span>
    <div class="live"><span class="dot"></span><span id="liveLabel">connecting…</span></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="k">PARTICIPANTS</div><div class="v" id="stCount">0</div></div>
    <div class="stat"><div class="k">TOP SCORE</div><div class="v" id="stTop">0</div></div>
    <div class="stat"><div class="k">FLAGS CAPTURED</div><div class="v" id="stFlags">0</div></div>
    <div class="stat"><div class="k">FULL CLEARS (5/5)</div><div class="v" id="stClears">0</div></div>
  </div>

  <table id="board">
    <thead>
      <tr>
        <th>#</th><th>OPERATOR</th><th>PROGRESS L1–L5</th>
        <th>SOLVED</th><th>SCORE</th><th>HINTS</th><th>LAST SEEN</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    no operators checked in yet — waiting for participants…
  </div>

  <div class="footer">
    Auto-refreshing every 4s · <a class="back" href="/">◂ back to challenge</a>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let prevScores={};   // id -> score, to flash rows that changed

function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<10) return 'just now';
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}

function progressCells(p){
  let html='<div class="prog">';
  for(let i=1;i<=5;i++){
    const done=i<=p.solved;                 // solved levels are contiguous by unlock rule
    const cur=(i===p.current && !done);
    html+=`<span class="cell${done?' done':''}${cur?' cur':''}" title="Level ${i}"></span>`;
  }
  return html+'</div>';
}

async function refresh(){
  try{
    const r=await fetch('/api/scores',{cache:'no-store'});
    const d=await r.json();
    const players=d.players||[];
    $('liveLabel').textContent='live · '+new Date().toLocaleTimeString();

    // stats
    $('stCount').textContent=players.length;
    $('stTop').textContent=players.length?players[0].score:0;
    $('stFlags').textContent=players.reduce((a,p)=>a+(p.solved||0),0);
    $('stClears').textContent=players.filter(p=>p.solved>=5).length;

    const rows=$('rows'), empty=$('empty');
    if(!players.length){ rows.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';

    rows.innerHTML=players.map((p,i)=>{
      const rank=i+1;
      const rc=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
      const changed=prevScores[p.id]!==undefined && prevScores[p.id]!==p.score;
      return `<tr class="${changed?'flash':''}">
        <td class="rank ${rc}">${rank}</td>
        <td><span class="pname">${esc(p.name)}</span><span class="ptitle">${esc(p.title||'')}</span></td>
        <td>${progressCells(p)}</td>
        <td>${p.solved}/5</td>
        <td class="score">${p.score}</td>
        <td class="hints">${p.hints||0}</td>
        <td class="ago">${timeAgo(p.updated)}</td>
      </tr>`;
    }).join('');

    prevScores={}; players.forEach(p=>prevScores[p.id]=p.score);
  }catch(e){
    $('liveLabel').textContent='reconnecting…';
  }
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

refresh();
setInterval(refresh,4000);
</script>
</body>
</html>
